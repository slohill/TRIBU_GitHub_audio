name: Fix agent close rerender 20260910
on:
  push:
    branches: [clean-online-sync-from-4034-20260907]
    paths:
      - '.github/workflows/fix-agent-close-rerender-20260910.yml'
jobs:
  patch-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Guard expected main and historical backup
        run: |
          test "$(git rev-parse HEAD)" = "1385675082ac945f4b6b1aabb5efa6a3489fbe5e"
          test "$(git ls-remote origin refs/heads/backup-before-full-rule-transposition-2026-09-07 | cut -f1)" = "4034c26c69c575095146d4a51588aa82db8d746a"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Load patch from staging
        run: git show origin/clean-online-sync-from-4034-20260907:scripts/fix_agent_close_rerender_20260910.py > /tmp/patch.py
      - name: Apply patch
        run: python /tmp/patch.py
      - name: Syntax and functional regression
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert "if(!force&&(!closedAgentKind||['spy','thief'].includes(closedAgentKind)))resumeGameAfterPriorityCard('reprise après capacité Agent');" in s
          assert "$('agentClose').onclick=closeAgentModal" in s
          assert "if(G&&G.phase==='play')render();" in s
          assert "$('localTestBtn').onclick=()=>{onlinePseudo();launchLegacyMode('2v3',3)};" in s
          PY
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script src="https://tribu-online.onrender.com/socket.io/socket.io.js"></script>')
          js=s[s.index('<script>',a)+8:s.rindex('</script>')]
          Path('/tmp/index.js').write_text(js)
          PY
          node --check /tmp/index.js
          node <<'NODE'
          let agentModalState=null,caravanState=null,resumes=0;
          const els={agentOverlay:{classList:{add(){}}},agentChoices:{innerHTML:''}};
          const $=id=>els[id];
          function resumeGameAfterPriorityCard(){resumes++}
          function log(){} function showCaravanChoice(){}
          function closeAgentModal(force=false){
            force=force===true;
            if(!force&&caravanState&&agentModalState&&agentModalState.kind==='caravan'){log();showCaravanChoice();return;}
            const closedAgentKind=agentModalState&&agentModalState.kind;
            agentModalState=null;$('agentOverlay').classList.add('hidden');$('agentChoices').innerHTML='';
            if(!force&&(!closedAgentKind||['spy','thief'].includes(closedAgentKind)))resumeGameAfterPriorityCard('reprise après capacité Agent');
          }
          agentModalState={kind:'thief'}; closeAgentModal({type:'click'});
          if(resumes!==1) throw new Error('thief click did not resume');
          agentModalState=null; closeAgentModal({type:'click'});
          if(resumes!==2) throw new Error('stale synced Agent modal did not resume');
          agentModalState={kind:'spy'}; closeAgentModal({type:'click'});
          if(resumes!==3) throw new Error('spy click did not resume');
          agentModalState={kind:'thief'}; closeAgentModal(true);
          if(resumes!==3) throw new Error('forced close must not resume');
          NODE
          git diff --check
          test "$(git diff --name-only)" = "index.html"
      - name: Commit production file only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Restaure les contrôles après fermeture Agent Online"
          git push origin HEAD:main
