name: Patch live bot commit queue v2
on:
  push:
    branches: [clean-online-sync-from-4034-20260907]
    paths: [scripts/patch_live_bot_commit_queue_v2.py, .github/workflows/patch-live-bot-commit-queue-v2.yml]
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: clean-online-sync-from-4034-20260907}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python scripts/patch_live_bot_commit_queue_v2.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text();Path('/tmp/a.js').write_text(s.rsplit('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/a.js
          grep -q "Ne jamais lui réappliquer" index.html
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Préserve le conducteur pendant la synchro live des bots'
          git push origin HEAD:clean-online-sync-from-4034-20260907
