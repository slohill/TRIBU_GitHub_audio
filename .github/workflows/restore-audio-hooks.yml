name: Patch TRIBU audio and cards
on:
  push:
    paths:
      - .github/workflows/restore-audio-hooks.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/patch_audio_preload.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/tribu.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)),encoding='utf-8')
          PY
          node --check /tmp/tribu.js
      - name: Commit game
        run: |
          git config user.name "TRIBU fixes"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Précharge les cartes et garde l'ambiance pendant les batailles"
          git push
