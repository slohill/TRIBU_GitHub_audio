name: Patch TRIBU battle preview and sea attack
'on':
  push:
    paths:
      - .github/workflows/restore-audio-hooks.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply battle preview and sea attack patch
        run: python3 .github/scripts/patch_battle_preview_sea.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'function previewBattleDefenders(id)' in s
          assert 'src.unshift(d)' in s
          assert 'previewAttacker' in s
          assert 'const sameAreaOnly=Object.keys(picks)' in s
          Path('/tmp/tribu.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)),encoding='utf-8')
          PY
          node --check /tmp/tribu.js
      - name: Commit game
        run: |
          git config user.name "TRIBU fixes"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Ajoute apercu bataille et attaque maritime sur place"
          git push
