name: Patch TRIBU Online welcome
'on':
  push:
    paths:
      - .github/workflows/restore-audio-hooks.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Online welcome patch
        run: python3 .github/scripts/patch_online_welcome.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'Tribu Le Jeu Online' in s
          assert 'Mode test local — 2 joueurs vs 3 bots' in s
          assert 'ONLINE_RANDOM_NAMES' in s
          assert "launchLegacyMode('2v3',3)" in s
          Path('/tmp/tribu.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)),encoding='utf-8')
          PY
          node --check /tmp/tribu.js
      - name: Commit game
        run: |
          git config user.name "TRIBU fixes"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Ajoute accueil TRIBU Online beta"
          git push
