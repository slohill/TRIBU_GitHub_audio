name: Preload TRIBU card art
on:
  push:
    paths:
      - .github/workflows/restore-audio-hooks.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preload official card art
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="['CARD_IMAGES','CARD_IMG','CARD_ART','ORACLE_IMAGES','ORACLE_IMG','FACTION_PORTRAITS','DICE_IMAGES','DIE_IMAGES','TOKEN_IMAGES','MAP_IMAGES','MAP_IMG']"
          new="['OFFICIAL_CARD_ART','OFFICIAL_ORACLE_ART','ORACLE_CARD_ART','CARD_IMAGES','CARD_IMG','CARD_ART','ORACLE_IMAGES','ORACLE_IMG','FACTION_PORTRAITS','DICE_IMAGES','DIE_IMAGES','TOKEN_IMAGES','MAP_IMAGES','MAP_IMG']"
          if old not in s: raise SystemExit('preload table list not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          if "'OFFICIAL_CARD_ART'" not in s: raise SystemExit('OFFICIAL_CARD_ART preload missing')
          Path('/tmp/tribu.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)),encoding='utf-8')
          PY
          node --check /tmp/tribu.js
      - name: Commit game
        run: |
          git config user.name "TRIBU fixes"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Précharge les illustrations des cartes TRIBU"
          git push
