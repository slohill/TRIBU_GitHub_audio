name: Patch TRIBU Online launch
'on':
  push:
    paths:
      - .github/workflows/restore-audio-hooks.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Online launch and logo
        run: python3 .github/scripts/patch_launch_online.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'onlineBrandLogo' in s
          assert 'data:image/webp;base64,' in s
          assert 'function launchOnlineRoom(room)' in s
          assert "mode==='3v2-online'" in s
          assert "launchLegacyMode('2v3',3)" in s
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/tribu.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/tribu.js
      - name: Commit game
        run: |
          git config user.name "TRIBU fixes"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Ajoute le logo et le lancement commun TRIBU Online"
          git push
