name: Preload TRIBU cards and keep ambient music in battles
'on':
  push:
    paths:
      - .github/workflows/restore-audio-hooks.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch card preload and battle audio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='const FACTION_PORTRAITS='
          preload="""function preloadOfficialCardArt(){
           Object.values(OFFICIAL_CARD_ART).forEach(src=>{const img=new Image();img.decoding='async';img.src=src});
          }
          preloadOfficialCardArt();

          const FACTION_PORTRAITS="""
          if old not in s: raise SystemExit('card preload anchor missing')
          s=s.replace(old,preload,1)
          old=' battle:"assets/audio/battle.mp3",\n'
          if old not in s: raise SystemExit('battle audio source anchor missing')
          s=s.replace(old,'',1)
          start=s.find('function audioBattleBegin(){')
          end=s.find('\nfunction audioBattleEnd(){',start)
          if start<0 or end<0: raise SystemExit('audioBattleBegin block missing')
          s=s[:start]+"""function audioBattleBegin(){
 audioBattleCue();
 if(audioBattleActive)return;
 audioBattleActive=true;
 // La bataille garde la musique d'ambiance : seuls les SFX tambours/cor se jouent.
 audioMode='ambient';
}"""+s[end:]
          start=s.find('function audioBattleEnd(){')
          end=s.find('\nfunction audioSetMusic(',start)
          if start<0 or end<0: raise SystemExit('audioBattleEnd block missing')
          s=s[:start]+"""function audioBattleEnd(){
 if(!audioBattleActive)return;
 audioBattleActive=false;
 audioMode='ambient';
}"""+s[end:]
          old=" if(audioBattleActive){const b=audioTrack('battle');b.volume=.39;audioSafePlay(b,Math.max(28,b.currentTime||28));return}\n"
          if old not in s: raise SystemExit('music toggle battle anchor missing')
          s=s.replace(old,'',1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'function preloadOfficialCardArt()' in s
          assert 'Object.values(OFFICIAL_CARD_ART)' in s
          assert 'assets/audio/battle.mp3' not in s
          assert "audioTrack('battle')" not in s
          assert 'audioBattleCue();' in s
          Path('/tmp/tribu.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)),encoding='utf-8')
          PY
          node --check /tmp/tribu.js
      - name: Commit game
        run: |
          git config user.name "TRIBU fixes"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Précharge les cartes et conserve l'ambiance en bataille"
          git push
