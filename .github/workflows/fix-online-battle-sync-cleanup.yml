name: Fix Online battle sync cleanup
on:
  push:
    branches: [clean-online-sync-from-4034-20260907]
    paths:
      - scripts/fix_online_battle_sync_cleanup.py
      - .github/workflows/fix-online-battle-sync-cleanup.yml
permissions:
  contents: write
jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Guard expected main
        run: test "$(git rev-parse HEAD)" = "0f23223df22d103cbb6a1f8aa7522d0a9fcedc9b"
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Load patch
        run: |
          git fetch origin clean-online-sync-from-4034-20260907 --depth=1
          git show FETCH_HEAD:scripts/fix_online_battle_sync_cleanup.py > /tmp/fix.py
      - name: Apply fix
        run: python /tmp/fix.py
      - name: Syntax and guards
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text();Path('/tmp/tribu.js').write_text(s.rsplit('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/tribu.js
          grep -q 'onlineLegacyBattleViewSeconds' index.html
          grep -q "if(!battle){onlineLegacyBattleViewSeconds=null;hideBattle();return;}" index.html
          grep -q 'if(G&&G.online&&G.online.legacySync)onlineLegacyPushNow();' index.html
      - name: Commit production fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Synchronise les priorités et nettoie les batailles Online'
          git push origin HEAD:main
