name: Fix Online live bot and start choice
on:
  push:
    branches: [clean-online-sync-from-4034-20260907]
    paths:
      - scripts/fix_online_live_bot_and_start_choice.py
      - .github/workflows/fix-online-live-bot-and-start-choice.yml
permissions:
  contents: write
jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clean-online-sync-from-4034-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply fix
        run: python scripts/fix_online_live_bot_and_start_choice.py
      - name: Check browser script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/tribu.js').write_text(js)
          PY
          node --check /tmp/tribu.js
      - name: Guard behavior
        run: |
          grep -q "function onlineLegacyPushLiveBot" index.html
          grep -q "activePlayer&&activePlayer.bot)onlineLegacyPushLiveBot" index.html
          grep -q "paidDrawState||goldReaction||G.phase!=='start'" index.html
      - name: Commit production fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Synchronise les bots en direct et verrouille le choix de début"
          git push origin HEAD:clean-online-sync-from-4034-20260907
