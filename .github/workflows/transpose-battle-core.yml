name: Transpose battle core
on:
  push:
    branches: [transpose-original-rules]
    paths:
      - '.github/scripts/transpose_battle_core.py'
      - '.github/workflows/transpose-battle-core.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: transpose-original-rules
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch
        run: python .github/scripts/transpose_battle_core.py
      - name: Check server JavaScript
        run: node --check server/server.js
      - name: Check inline client JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/client.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/client.js
      - name: Verify battle invariants
        run: |
          grep -q "battle: battlePublicView" server/server.js
          grep -q "BATTLE_PASS" server/server.js
          grep -q "BATTLE_CARD" server/server.js
          grep -q "startAuthoritativeBattle" server/server.js
          grep -q "onlineRenderAuthoritativeBattle" index.html
          grep -q "$('localTestBtn').onclick=()=>{onlinePseudo();launchLegacyMode('2v3',3)};" index.html
          git diff --check
      - name: Commit generated battle core
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html server/server.js
          git commit -m "Transpose le noyau des batailles autoritaires" || exit 0
          git push origin HEAD:transpose-original-rules
