name: Apply new default names
on:
  push:
    branches: [clean-online-sync-from-4034-20260907]
    paths: ['.github/workflows/apply-default-names-20260916.yml']
permissions:
  contents: write
jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: clean-online-sync-from-4034-20260907, path: staging}
      - uses: actions/checkout@v4
        with: {ref: main, path: prod, fetch-depth: 0}
      - name: Verify exact main SHA
        working-directory: prod
        run: test "$(git rev-parse HEAD)" = "8ae90cdd3ed2d2c7670bc2ea2a52cfa315b8bc2c"
      - name: Apply focused patch
        working-directory: prod
        run: python ../staging/tmp_patch_default_names_20260916.py
      - name: Verify
        working-directory: prod
        run: |
          python - <<'PY'
          from pathlib import Path
          names="['Valkor','Xodia','Oldirn','Mundris','Ferna','Dronk','Spoltreg','Nimun','Raenura','Keplet']"
          s=Path('index.html').read_text(encoding='utf-8'); srv=Path('server/server.js').read_text(encoding='utf-8')
          assert 'const ONLINE_RANDOM_NAMES='+names+';' in s
          assert 'const DEFAULT_NAMES = '+names+';' in srv
          assert "$('localTestBtn').onclick=()=>{onlinePseudo();launchLegacyMode('2v3',3)};" in s
          a=s.rfind('<script>'); b=s.find('</script>',a); assert a>=0 and b>a
          Path('/tmp/tribu.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/tribu.js
          node --check server/server.js
          git diff --check
          test "$(git status --short | wc -l)" -eq 2
      - name: Commit production files
        working-directory: prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html server/server.js
          git commit -m "Change les noms par défaut"
          git push origin HEAD:main
