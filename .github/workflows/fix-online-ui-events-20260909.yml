name: Fix online UI events 20260909
on:
  push:
    branches: [clean-online-sync-from-4034-20260907]
    paths:
      - 'scripts/fix_online_ui_events_20260909.py'
      - '.github/workflows/fix-online-ui-events-20260909.yml'
permissions:
  contents: write
jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Guard expected main
        run: test "$(git rev-parse HEAD)" = "101b8dc72593ac7638778b68f78ea6d696c64c11"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Load patch
        run: curl -fsSL https://raw.githubusercontent.com/slohill/TRIBU_GitHub_audio/clean-online-sync-from-4034-20260907/scripts/fix_online_ui_events_20260909.py -o /tmp/patch.py
      - name: Apply patch
        run: python /tmp/patch.py
      - name: Syntax and guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('<script>')+len('<script>'); b=s.rindex('</script>')
          Path('/tmp/tribu.js').write_text(s[a:b],encoding='utf-8')
          guards=[
            'function previewDestinationUnits(id)',
            'g.textContent=previewDestinationUnits(id)',
            'G.assassinNotice={seq:',
            'function showOracleRemoteNotice(name)',
            'G.oraclePresentation={seq:',
            'if(caravanState)showCaravanChoice()',
            "b.disabled=!mayChoose",
            "if(G.players[chooser].bot)onlineLegacyPushNow();else onlineLegacyPushPriorityCardNow()",
            '#divinationText{display:block;line-height:1.4'
          ]
          for g in guards: assert g in s,g
          assert "showAssassinMapMessage(target.owner,target.name,actor,killed);\n render();" not in s
          assert "g.textContent=selected();b.appendChild(g)" not in s
          assert "$('localTestBtn').onclick=()=>{onlinePseudo();launchLegacyMode('2v3',3)};" in s
          PY
          node --check /tmp/tribu.js
          git diff --check
          test "$(git status --short | awk '{print $2}' | tr '\n' ' ')" = "index.html "
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Corrige les aperçus et événements partagés Online"
          git push origin HEAD:main
