name: Fix Online logo and private hands
'on':
  push:
    branches:
      - fix-online-logo-hands
    paths:
      - .github/workflows/fix-online-logo-hands.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused Online fixes
        run: python3 .github/scripts/fix_online_logo_hands.py
      - name: Validate JavaScript and invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'function isHotseatMode(){return !!G&&!G.online&&humanPlayers().length>1}' in s
          assert 'G.online.myPlayerIndex' in s
          assert 'src="assets/tribu-title.webp?v=1"' in s
          assert 'data:image/webp;base64,' not in s[s.find('<div class="onlineBrand">'):s.find('</div>',s.find('<div class="onlineBrand">'))]
          assert "$('localTestBtn').onclick=()=>{onlinePseudo();launchLegacyMode('2v3',3)};" in s
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/tribu.js').write_text('\n'.join(scripts),encoding='utf-8')
          logo=Path('assets/tribu-title.webp')
          assert logo.exists() and logo.stat().st_size>1000
          print('logo_sha256='+hashlib.sha256(logo.read_bytes()).hexdigest())
          print('logo_size='+str(logo.stat().st_size))
          PY
          node --check /tmp/tribu.js
      - name: Commit tested fix to working branch
        run: |
          git config user.name "TRIBU fixes"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/tribu-title.webp
          git diff --cached --check
          git commit -m "Corrige le logo et la main propre à chaque joueur Online"
          git push
# retry robust logo extraction
