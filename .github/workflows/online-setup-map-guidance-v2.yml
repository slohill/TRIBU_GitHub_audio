name: Online setup map guidance v2
on:
  push:
    branches:
      - online-setup-map-guidance
    paths:
      - .github/workflows/online-setup-map-guidance-v2.yml
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: online-setup-map-guidance
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 .github/scripts/patch_online_setup_map_guidance.py
      - run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          section=s[s.index('function onlineSetupRegionsFor'):s.index('function onlineLockControls')]
          assert 'Province <b>' not in section
          assert 'Votre province' not in section
          assert 'régions en surbrillance' in section
          assert 'onlineSetupAvailable' in s
          assert 'onlineSetupPreviewDie' in s
          assert 'onlineSetupMapFeedback(state,active)' in s
          assert "$('localTestBtn').onclick=()=>{onlinePseudo();launchLegacyMode('2v3',3)};" in s
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/inline.js
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Guide le placement Online directement sur la carte'
          git push origin HEAD:online-setup-map-guidance
