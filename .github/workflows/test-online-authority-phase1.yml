name: Test Online authority phase 1
on:
  push:
    branches: [online-authority-phase1]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch client
        run: python .github/scripts/patch_online_authority_client.py
      - name: Validate server syntax
        run: node --check server/server.js
      - name: Validate client patch
        run: |
          grep -q "socket.on('gameState',onlineApplyServerGame)" index.html
          grep -q "onlineSocket.emit('setupChoice'" index.html
          grep -q "onlineGameAction('DRAW')" index.html
          grep -q "$('localTestBtn').onclick=()=>{onlinePseudo();launchLegacyMode('2v3',3)};" index.html
          grep -q "function isHotseatMode(){return !!G&&!G.online&&humanPlayers().length>1}" index.html
      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          Path('/tmp/tribu-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/tribu-inline.js
      - name: Check whitespace
        run: git diff --check
      - name: Commit tested client
        run: |
          if git diff --quiet -- index.html; then
            echo "Client already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Branche le client sur l'autorité serveur Online"
          git push
