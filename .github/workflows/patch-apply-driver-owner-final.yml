name: Patch apply driver owner final
on:
  push:
    branches: [clean-online-sync-from-4034-20260907]
    paths: [scripts/patch_apply_driver_owner_final.py, .github/workflows/patch-apply-driver-owner-final.yml]
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: clean-online-sync-from-4034-20260907}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python scripts/patch_apply_driver_owner_final.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text();Path('/tmp/a.js').write_text(s.rsplit('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/a.js
          grep -q 'G.online.botDriverOwner=onlineLegacyBotDriverOwner' index.html
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Finalise la propagation du conducteur bot'
          git push origin HEAD:clean-online-sync-from-4034-20260907
