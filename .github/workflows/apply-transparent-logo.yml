name: Apply transparent TRIBU logo

on:
  push:
    branches: [fix-logo-transparent]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-logo-transparent
      - name: Rebuild transparent logo
        shell: bash
        run: |
          cat .github/logo-transparent.part0 .github/logo-transparent.part1 .github/logo-transparent.part2 .github/logo-transparent.part3 .github/logo-transparent.part4 > /tmp/tribu-logo.b64
          base64 -d /tmp/tribu-logo.b64 > assets/tribu-title.webp
          echo "31b4ecc9eb602306b974ea8b1e7d1792d44307c40aaf8cc374e45db6bcdd80a9  assets/tribu-title.webp" | sha256sum -c -
          test "$(stat -c%s assets/tribu-title.webp)" -eq 28302
      - name: Bust logo cache and preserve local test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='assets/tribu-title.webp?v=2'
          new='assets/tribu-title.webp?v=3'
          if old not in s:
              raise SystemExit('Logo source v2 not found')
          s=s.replace(old,new,1)
          required="$('localTestBtn').onclick=()=>{onlinePseudo();launchLegacyMode('2v3',3)};"
          if required not in s:
              raise SystemExit('Local 2v3 test button changed unexpectedly')
          p.write_text(s)
          PY
          git diff --check
      - name: Remove transfer helpers
        shell: bash
        run: |
          rm -f .github/logo-transparent.part0 .github/logo-transparent.part1 .github/logo-transparent.part2 .github/logo-transparent.part3 .github/logo-transparent.part4
          rm -f .github/tribu-logo-transparent.b64 .github/tmp-logo-note.txt
          rm -f .github/workflows/apply-transparent-logo.yml
      - name: Commit clean result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige le logo TRIBU transparent"
          git push origin HEAD:fix-logo-transparent
