name: Fix paid draw pauses gold 20260914
on:
  push:
    branches: [clean-online-sync-from-4034-20260907]
    paths:
      - '.github/workflows/fix-paid-draw-pauses-gold-20260914.yml'
      - 'scripts/fix_paid_draw_pauses_gold_20260914.py'
permissions:
  contents: write
jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Guard expected main and historical backup
        run: |
          test "$(git rev-parse HEAD)" = "6c80f7e7c2b28e52252127d4e236af4e4c4671ad"
          git fetch origin backup-before-full-rule-transposition-2026-09-07 clean-online-sync-from-4034-20260907
          test "$(git rev-parse origin/backup-before-full-rule-transposition-2026-09-07)" = "4034c26c69c575095146d4a51588aa82db8d746a"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Load patch from staging
        run: git show origin/clean-online-sync-from-4034-20260907:scripts/fix_paid_draw_pauses_gold_20260914.py > /tmp/patch.py
      - name: Apply patch
        run: python /tmp/patch.py
      - name: Syntax and functional regression
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script>')+len('<script>'); b=s.rindex('</script>')
          Path('/tmp/tribu.js').write_text(s[a:b])
          assert "const pausedGold=!!goldReaction;\n if(pausedGold)pauseGoldReactionForCard();" in s
          assert "paidDrawState={player:viewer,seconds:10,phase:G.phase,pausedGold};" in s
          assert "const resumeGold=!!paidDrawState.pausedGold;" in s
          assert "if(resumeGold&&goldReaction&&goldReaction.pausedByCard)" in s
          assert "goldReaction&&goldReaction.pausedByCard&&!paidDrawState" in s
          assert "if(pausedGold)onlineLegacyPushGoldReactionNow();" in s
          assert "$('localTestBtn').onclick=()=>{onlinePseudo();launchLegacyMode('2v3',3)};" in s
          assert 'Naviguer' in s
          PY
          node --check /tmp/tribu.js
          git diff --check
          test "$(git diff --name-only)" = "index.html"
      - name: Commit production file only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Répare la pioche payante pendant un gain d'or"
          git push origin HEAD:main
