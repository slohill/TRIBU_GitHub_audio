name: Authoritative play core v2
on:
  push:
    branches: [online-authoritative-play-core]
jobs:
  patch-test:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: online-authoritative-play-core }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: python3 .github/scripts/patch_authoritative_play_core_v2.py
      - run: node --check server/server.js
      - name: Check inline client JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text();js=s.rsplit('<script>',1)[1].split('</script>',1)[0];Path('/tmp/client.js').write_text(js)
          PY
          node --check /tmp/client.js
      - name: Verify
        run: |
          grep -F "oracleActive:state.oracleActive===null?null:state.oracleActive" index.html
          grep -F "Dernier dé Oracle" index.html
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html server/server.js
          git commit -m 'Ajuste l état partagé de la boucle autoritaire'
          git push origin HEAD:online-authoritative-play-core
