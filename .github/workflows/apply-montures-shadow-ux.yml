name: Apply Montures and Shadow UX on cleanup branch

on:
  push:
    branches: [cleanup-final-stabilization-20260917]
    paths:
      - '.github/workflows/apply-montures-shadow-ux.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-final-stabilization-20260917
      - name: Guard branch head
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/cleanup-final-stabilization-20260917)"
      - name: Patch exact current code
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          def once(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 exact match, got {n}')
              s=s.replace(old,new,1)

          once(".shadowSrc{box-shadow:0 0 0 4px #111,0 0 14px #000!important}\n",
               ".shadowSrc{box-shadow:none!important}\n.shadowSrc::after{content:'';position:absolute;left:50%;top:calc(50% + 21px);transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:#050505;box-shadow:0 0 0 1px #fff8;z-index:33;pointer-events:none}\n",
               'shadow marker css')

          once("function playMonturesMovement(handIndex){\n const i=localViewer();if(!canUseMonturesMove(i))return;\n const id=G.players[i].hand[handIndex];if(id===undefined||CARDS[id].name!=='Montures')return;\n G.players[i].hand.splice(handIndex,1);G.discard.push(id);\n // +1 point de déplacement à TOUTES les unités du joueur, y compris celles à 0.\n",
               "function playMonturesMovement(handIndex){\n const i=localViewer();if(!canUseMonturesMove(i))return;\n const id=G.players[i].hand[handIndex];if(id===undefined||CARDS[id].name!=='Montures')return;\n G.players[i].hand.splice(handIndex,1);G.discard.push(id);\n // Montures ouvre le second déplacement de chaque destination, sans jamais\n // autoriser une seconde bataille sur une région déjà attaquée (attacked reste intact).\n cycle=2;\n // +1 point de déplacement à TOUTES les unités du joueur, y compris celles à 0.\n",
               'montures second movement')

          once(" if(G.phase==='play'&&dest&&legalSources(dest).includes(id)){\n   b.classList.add('srcHold');\n   const q=picks[id]||0;\n   if(q>0){\n     const minus=document.createElement('button');\n     minus.className='sourceMinus';minus.textContent='−';minus.title='Remettre 1 unité sur '+id;\n     minus.onpointerdown=e=>e.stopPropagation();\n     minus.onclick=e=>{e.stopPropagation();adjust(id,-1)};\n     b.appendChild(minus);\n   }\n }\n",
               " const shadowGatherHere=!!(shadowState&&shadowState.stage==='gather'&&!isSea(id)&&G.b[id].owner===shadowState.player);\n if(G.phase==='play'&&dest&&legalSources(dest).includes(id)){\n   b.classList.add('srcHold');\n   const q=picks[id]||0;\n   if(q>0){\n     const minus=document.createElement('button');\n     minus.className='sourceMinus';minus.textContent='−';minus.title='Remettre 1 unité sur '+id;\n     minus.onpointerdown=e=>e.stopPropagation();\n     minus.onclick=e=>{e.stopPropagation();adjust(id,-1)};\n     b.appendChild(minus);\n   }\n }else if(shadowGatherHere){\n   b.classList.add('srcHold');\n   const q=shadowState.picks[id]||0;\n   if(q>0){\n     const minus=document.createElement('button');\n     minus.className='sourceMinus';minus.textContent='−';minus.title='Remettre 1 unité sur '+id;\n     minus.onpointerdown=e=>e.stopPropagation();\n     minus.onclick=e=>{e.stopPropagation();adjustShadow(id,-1)};\n     b.appendChild(minus);\n   }\n }\n",
               'shadow minus')

          once(" if(G.phase==='play'&&dest&&legalSources(dest).includes(id)){\n   b.onpointerdown=e=>{\n     if(e.target!==b)return;\n     e.preventDefault();\n     longTriggered=false;\n     holdTimer=setTimeout(()=>{longTriggered=true;pickAllFromSource(id)},480);\n   };\n   b.onpointerup=()=>{if(holdTimer)clearTimeout(holdTimer)};\n   b.onpointerleave=()=>{if(holdTimer)clearTimeout(holdTimer)};\n   b.onpointercancel=()=>{if(holdTimer)clearTimeout(holdTimer)};\n   b.onclick=e=>{\n     if(e.target!==b)return;\n     if(longTriggered){longTriggered=false;return}\n     clickSpot(id);\n   };\n }else{\n   b.onclick=()=>clickSpot(id);\n }\n map.appendChild(b);\n if(shadowState&&shadowState.stage==='gather'&&!isSea(id)&&G.b[id].owner===shadowState.player){\n   const fp=POS[id],ctl=document.createElement('div');ctl.className='floatActions';ctl.style.left=(fp[0]+3)+'%';ctl.style.top=(fp[1]+4)+'%';ctl.innerHTML='<button class=\"no\">−</button><button class=\"yes\">+'+(shadowState.picks[id]||0)+'</button>';\n   const cb=ctl.querySelectorAll('button');cb[0].onclick=e=>{e.stopPropagation();adjustShadow(id,-1)};cb[1].onclick=e=>{e.stopPropagation();shadowAll(id)};map.appendChild(ctl);\n }\n",
               " const movementSourceHere=G.phase==='play'&&dest&&legalSources(dest).includes(id);\n if(movementSourceHere||shadowGatherHere){\n   b.onpointerdown=e=>{\n     if(e.target!==b)return;\n     e.preventDefault();\n     longTriggered=false;\n     holdTimer=setTimeout(()=>{longTriggered=true;if(shadowGatherHere)shadowAll(id);else pickAllFromSource(id)},480);\n   };\n   b.onpointerup=()=>{if(holdTimer)clearTimeout(holdTimer)};\n   b.onpointerleave=()=>{if(holdTimer)clearTimeout(holdTimer)};\n   b.onpointercancel=()=>{if(holdTimer)clearTimeout(holdTimer)};\n   b.onclick=e=>{\n     if(e.target!==b)return;\n     if(longTriggered){longTriggered=false;return}\n     clickSpot(id);\n   };\n }else{\n   b.onclick=()=>clickSpot(id);\n }\n map.appendChild(b);\n",
               'shadow source pointer UX')

          p.write_text(s)
          PY
      - name: Static and invariant checks
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert "cycle=2;" in s
          assert "attacked.add(target);" in s
          assert "if(enemy&&!isSea(id)&&attacked.has(id))" in s
          assert "shadowSrc::after" in s
          assert "if(shadowGatherHere)shadowAll(id);else pickAllFromSource(id)" in s
          assert "adjustShadow(id,-1)" in s
          assert "ctl.className='floatActions'" not in s
          assert "$('localTestBtn').onclick=()=>{onlinePseudo();launchLegacyMode('2v3',3)};" in s
          blocks=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/tribu-inline.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/tribu-inline.js
      - name: Commit branch-only test patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Teste Montures et sélection Section de l'ombre"
          git push origin HEAD:cleanup-final-stabilization-20260917
