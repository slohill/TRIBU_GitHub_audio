name: Fix Oracle climate cleanup 20260915
permissions:
  contents: write
on:
  push:
    branches: [clean-online-sync-from-4034-20260907]
    paths: ['.github/workflows/fix-oracle-climate-cleanup-20260915.yml']
  workflow_dispatch:
jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify exact main
        run: |
          test "$(git rev-parse HEAD)" = "d3a78e09b18ec007a819d05d7bca20a1a872a2a1"
      - name: Fetch patch script from staging
        run: |
          git show origin/clean-online-sync-from-4034-20260907:.github/scripts/patch_oracle_climate_cleanup_20260915.py > /tmp/patch.py
          python /tmp/patch.py
      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script>')+len('<script>')
          b=s.rindex('</script>')
          Path('/tmp/tribu.js').write_text(s[a:b])
          PY
          node --check /tmp/tribu.js
      - name: Functional Oracle climate regression
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          no_queue="""if(!queues.length){
   log(name+' : aucune région éligible à sacrifier.');
   checkDecimations();
   finishOracleResolution();
   render();
   completeOracleResolution();"""
          completed="""if(oracleState&&oracleState.index>=oracleState.queues.length){
   oracleState=null;
   checkDecimations();
   finishOracleResolution();
   render();
   completeOracleResolution();"""
          assert no_queue in s, 'nettoyage absent du chemin sans sacrifice'
          assert completed in s, 'nettoyage absent du chemin sacrifices terminés'
          # Simulation minimale de l invariant Canicule -> Tempête de sable.
          climate='Canicule'; pending=True
          def finish():
              global climate,pending
              if pending:
                  pending=False; climate=None
          finish()
          assert climate is None and pending is False
          print('Oracle climate cleanup regression: OK')
          PY
      - name: Structural invariants
        run: |
          grep -Fq "$('localTestBtn').onclick=()=>{onlinePseudo();launchLegacyMode('2v3',3)};" index.html
          grep -Fq "function finishOracleResolution()" index.html
          grep -Fq "oraclePendingNormalMap=climateEnding&&(nextName==='Givre mortel'||nextName==='Tempête de sable');" index.html
          git diff --check
          test "$(git diff --name-only)" = "index.html"
      - name: Commit and push only production file
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Nettoie le climat après résolution Oracle"
          git push origin HEAD:main
