name: Fix Oracle climate cleanup 20260915
permissions:
  contents: write
on:
  push:
    branches: [clean-online-sync-from-4034-20260907]
    paths: ['.github/workflows/fix-oracle-climate-cleanup-20260915.yml']
  workflow_dispatch:
jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify exact main
        run: test "$(git rev-parse HEAD)" = "d3a78e09b18ec007a819d05d7bca20a1a872a2a1"
      - name: Fetch and apply staging patch
        run: |
          git show origin/clean-online-sync-from-4034-20260907:.github/scripts/patch_oracle_climate_cleanup_20260915.py > /tmp/patch.py
          python /tmp/patch.py
      - name: JavaScript syntax
        run: |
          python -c "from pathlib import Path; s=Path('index.html').read_text(); Path('/tmp/tribu.js').write_text(s[s.index('<script>')+8:s.rindex('</script>')])"
          node --check /tmp/tribu.js
      - name: Regression and invariants
        run: |
          test "$(grep -c 'finishOracleResolution();' index.html)" -ge 5
          grep -Fq "log(name+' : aucune région éligible à sacrifier.');" index.html
          grep -Fq "oracleState&&oracleState.index>=oracleState.queues.length" index.html
          grep -Fq "$('localTestBtn').onclick=()=>{onlinePseudo();launchLegacyMode('2v3',3)};" index.html
          grep -Fq "oraclePendingNormalMap=climateEnding&&(nextName==='Givre mortel'||nextName==='Tempête de sable');" index.html
          git diff --check
          test "$(git diff --name-only)" = "index.html"
      - name: Commit and push only production file
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Nettoie le climat après résolution Oracle"
          git push origin HEAD:main
