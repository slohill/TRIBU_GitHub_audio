name: Fix online top restart
on:
  push:
    branches: [fix-online-top-restart-button]
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch
        run: python .github/scripts/fix_online_top_restart.py
      - name: Check inline client JavaScript
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/inline.js
      - name: Verify invariants
        run: |
          grep -F "restart.textContent='Recommencer le placement'" index.html
          grep -F "onlineSetTopRestartVisibility" index.html
          grep -F "$('localTestBtn').onclick=()=>{onlinePseudo();launchLegacyMode('2v3',3)};" index.html
          git diff --check
      - name: Commit generated client
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Masque Recommencer partie uniquement en Online"
          git push
