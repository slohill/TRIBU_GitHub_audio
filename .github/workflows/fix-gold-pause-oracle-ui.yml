name: Fix gold pause and Oracle UI
on:
  push:
    branches: [clean-online-sync-from-4034-20260907]
    paths: [scripts/fix_gold_pause_oracle_ui.py, .github/workflows/fix-gold-pause-oracle-ui.yml]
permissions: {contents: write}
jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Guard expected main
        run: test "$(git rev-parse HEAD)" = "4dfc7a66c572fcba31851ab7635a396a3af20700"
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Load patch
        run: curl -fsSL https://raw.githubusercontent.com/slohill/TRIBU_GitHub_audio/clean-online-sync-from-4034-20260907/scripts/fix_gold_pause_oracle_ui.py -o /tmp/patch.py
      - run: python /tmp/patch.py
      - name: Check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text();Path('/tmp/a.js').write_text(s.rsplit('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/a.js
          grep -q 'pauseGoldReactionForCard' index.html
          grep -q 'ORACLE_CARD_ART' index.html
          grep -q 'pioche/défausse recentrées' index.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Autorise les cartes pendant gain d'or et améliore l'UI Oracle"
          git push origin HEAD:main
