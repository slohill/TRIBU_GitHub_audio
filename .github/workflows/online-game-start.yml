name: Online game start
on:
  push:
    branches:
      - online-game-start
    paths:
      - .github/workflows/online-game-start.yml
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: online-game-start
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 .github/scripts/patch_online_game_start.py
      - run: |
          node --check server/server.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'Bienvenu·e·s dans Myrmigate : la partie peut commencer' in s
          assert "onlineGameAction('HARVEST_START')" in s
          assert "onlineGameAction('RECRUIT_START')" in s
          assert "onlineGameAction('RECRUIT_AT',{region:r})" in s
          assert "audioStartAmbient(audioAmbientIndex,0,true)" in s
          assert "$('localTestBtn').onclick=()=>{onlinePseudo();launchLegacyMode('2v3',3)};" in s
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/inline.js
          grep -q "HARVEST_START" server/server.js
          grep -q "RECRUIT_AT" server/server.js
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html server/server.js
          git commit -m 'Démarre la partie Online après installation'
          git push origin HEAD:online-game-start
