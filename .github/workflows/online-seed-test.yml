name: Test Online shared seed
'on':
  push:
    branches:
      - backup-before-online-sync-2026-09-07
    paths:
      - .github/workflows/online-seed-test.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply shared Online seed
        run: python3 .github/scripts/patch_online_seed_init.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'function makeOnlineSeededRandom(seed)' in s
          assert 'function tribuRandom()' in s
          assert 'onlineSeededRandom=makeOnlineSeededRandom(room.seed)' in s
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/tribu.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/tribu.js
      - name: Commit game
        run: |
          git config user.name "TRIBU fixes"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Synchronise le hasard initial Online"
          git push
