name: Fix Online move draft persistence
on:
  push:
    branches: [fix-online-move-draft-persistence-20260907]
    paths:
      - '.github/scripts/fix_online_move_draft_persistence.py'
      - '.github/workflows/fix-online-move-draft-persistence.yml'
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch
        run: python .github/scripts/fix_online_move_draft_persistence.py
      - name: Check inline client JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/tribu-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/tribu-inline.js
      - name: Verify movement draft invariants
        run: |
          grep -F "const localMoveDraft=(G&&G.online&&G.online.singleEngine&&G.phase==='play'" index.html
          grep -F "if(localMoveDraft&&G.phase==='play'&&G.active===me" index.html
          grep -F "$('localTestBtn').onclick=()=>{onlinePseudo();launchLegacyMode('2v3',3)};" index.html
          git diff --check
      - name: Commit generated production file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Préserve la sélection de déplacement pendant la synchro Online'
          git push
