name: Fix Online bot battle sync

on:
  push:
    branches:
      - clean-online-sync-from-4034-20260907
    paths:
      - '.github/scripts/fix_online_bot_battle_sync.py'
      - '.github/workflows/fix-online-bot-battle-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply bot/battle fix
        run: python .github/scripts/fix_online_bot_battle_sync.py
      - name: Check browser script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/tribu-inline.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          PY
          node --check /tmp/tribu-inline.js
      - name: Guard bot and battle sync
        run: |
          grep -Fq 'function onlineLegacyCanExecuteBot()' index.html
          grep -Fq 'function onlineLegacyOwnsBattlePriority()' index.html
          grep -Fq "if(battle)resumeBattleTimer();" index.html
      - name: Commit production fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fiabilise les bots et les priorités de bataille Online' || exit 0
          git push
